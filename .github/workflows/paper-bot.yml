name: paper-bot
on:
  schedule:
    - cron: "7 */6 * * *"     # backup: restarts the chain if it ever breaks
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # The 6-hour backup only starts the bot if no other copy is already running.
      - name: Skip backup run if the bot is already running
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow paper-bot.yml --status in_progress \
                --json databaseId --jq '[.[] | select(.databaseId != ${{ github.run_id }})] | length')
            if [ "$n" -gt 0 ]; then echo "Bot already running; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-python@v6
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Set up git
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
      # Public repo: free unlimited minutes, so scan every 15 min for ~5h40m, then start the next run.
      # Private repo: just one scan, so free minutes aren't used up.
      - name: Scan markets (both bot versions)
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            python run_loop.py 0
          else
            python run_loop.py 340
          fi
      - name: Start the next run
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' && github.event.repository.private == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run paper-bot.yml --ref main
